name: ci
on: [push, pull_request]
jobs:
  host:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -S .
      - run: cmake --build build
      - run: ctest --test-dir build -C Debug --output-on-failure # -C: VS multi-config puts exes in Debug/; ignored by single-config generators
  arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - run: cmake -B build-arm -S . -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
      - run: cmake --build build-arm --target p8core p8p600
