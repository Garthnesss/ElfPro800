name: ci
on: [push, pull_request]
jobs:
  host:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -S .
      # Release everywhere: it is the config a plugin ships in, and the MSVC
      # Debug CRT can park a headless runner on a modal assert dialog (the
      # 2026-10-28 Windows Debug ctest run stalled 17 min with no output and
      # had to be cancelled). --timeout keeps any future stall visible.
      - run: cmake --build build --config Release
      - run: ctest --test-dir build -C Release --timeout 120 --output-on-failure
  arm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - run: cmake -B build-arm -S . -DCMAKE_TOOLCHAIN_FILE=cmake/arm-none-eabi.cmake
      - run: cmake --build build-arm --target p8core p8p600
